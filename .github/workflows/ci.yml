# Runs the same checks we run locally on every pull request to main, and again
# on main after each merge (a PR's checks can be stale if main moved since).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only access to the repo is all these checks need.
permissions:
  contents: read

# If new commits arrive while a run is still going, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The checks take about a minute; fail a stuck run instead of waiting hours.
    timeout-minutes: 10

    # A Postgres 17 container that runs alongside the job, set up like
    # docker-compose.yml. The job waits until its health check passes.
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: champions
          POSTGRES_PASSWORD: champions
          POSTGRES_DB: champions
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U champions -d champions"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    # Every step can reach that database at this address.
    env:
      DATABASE_URL: postgres://champions:champions@localhost:5432/champions

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Nothing uses the database yet; this proves it started and is reachable,
      # so later database tests can rely on it.
      - name: Check database is reachable
        run: pg_isready --dbname="$DATABASE_URL"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
